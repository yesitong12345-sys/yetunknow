name: Unpack website for Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded website
        shell: bash
        run: |
          set -euo pipefail
          archive="living-desk-github-vercel-windows.zip"
          test -f "$archive"
          unzip -o "$archive" -d .
          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete website source"
          git push
