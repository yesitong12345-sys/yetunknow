name: Unpack website for Vercel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Windows ZIP
        continue-on-error: true
        run: unzip -o living-desk-github-vercel-windows.zip -d .
      - name: Verify and publish website
        shell: bash
        run: |
          set -euo pipefail
          test -f app/page.tsx
          test -f package.json
          test -f vercel.json
          rm -f living-desk-github-vercel-windows.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete website source"
          git push
