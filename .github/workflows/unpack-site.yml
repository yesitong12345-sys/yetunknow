name: Unpack website for Vercel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded website
        shell: bash
        run: |
          set -u
          archive="living-desk-github-vercel-windows.zip"
          test -f "$archive"
          unzip -o "$archive" -d .
          unzip_status=$?
          if [ "$unzip_status" -gt 1 ]; then exit "$unzip_status"; fi
          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete website source"
          git push
